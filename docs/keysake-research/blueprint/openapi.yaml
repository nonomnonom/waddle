openapi: 3.1.0
info:
  title: Bilingual Input Method API (Keysake-pattern blueprint)
  version: 1.0.0
  description: >
    Contracts derived from string/type evidence in Keysake.dmg plus deliberate design choices.
    [KEYSAKE] endpoints: /auth/apple/challenge, /auth/apple/web/exchange,
    /contents/statistics, /contents/grammar-analysis, /grammar-analyses, /settings.
servers:
  - url: https://api.example.com/v1
  - url: https://staging-api.example.com/v1

security:
  - userToken: []

components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    deviceDigest:
      in: header
      name: X-Device-Digest
      schema: { type: string }
    appVersion:
      in: header
      name: X-Product-Version
      schema: { type: string }
    imeVersion:
      in: header
      name: X-InputMethod-Version
      schema: { type: string }
    engineVersion:
      in: header
      name: X-Engine-Version
      schema: { type: string }
    idempotency:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Code:
      type: string
      enum:
        [
          ok,
          validation_failed,
          credential_missing,
          credential_invalid,
          unsupported_client,
          rate_limited,
          data_not_found,
          quota_exceeded,
          ai_provider_error,
          conflict,
          internal,
        ]
    Envelope:
      type: object
      required: [code, serverTime, requestId]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        message: { type: [string, 'null'] }
        data: {}
        serverTime: { type: integer, format: int64, description: epoch millis }
        requestId: { type: string }
    Fragment:
      type: object
      required: [id, sourceText, collectedAt]
      properties:
        id: { type: string, format: uuid }
        sourceText: { type: string }
        sourceLang: { type: string, examples: [zh-Hans] }
        charCount: { type: integer }
        collectedAt: { type: integer, format: int64 }
        tzOffsetMinutes: { type: integer }
        originAppBundle: { type: [string, 'null'] }
        status: { type: string, enum: [active, archived, deleted] }
        translation:
          type: [object, 'null']
          properties:
            targetLang: { type: string }
            provider: { type: string, enum: [apple-on-device, llm, none] }
            text: { type: string }
    FragmentInput:
      type: object
      required: [clientId, sourceText]
      properties:
        clientId: { type: string, format: uuid }
        sourceText: { type: string, maxLength: 20000 }
        sourceLang: { type: string, default: zh-Hans }
        translation:
          type: object
          properties:
            targetLang: { type: string }
            provider: { type: string }
            text: { type: string }
        collectedAt: { type: integer, format: int64 }
        tzOffsetMinutes: { type: integer }
        originAppBundle: { type: string }
        charCount: { type: integer }
    DailyCount:
      type: object
      required: [day]
      properties:
        day: { type: string, format: date }
        keystrokes: { type: integer, format: int64 }
        committedCount: { type: integer, format: int64 }
        collectedCount: { type: integer, format: int64 }
        charsCommitted: { type: integer, format: int64 }
        aiRequests: { type: integer, format: int64 }
    GrammarAnalysis:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, ok, error] }
        inputLang: { type: string }
        result:
          type: [object, 'null']
          properties:
            score: { type: number }
            issues:
              type: array
              items:
                type: object
                properties:
                  start: { type: integer }
                  length: { type: integer }
                  category: { type: string }
                  suggestion: { type: string }
                  explanation: { type: string }
        createdAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
    AiTask:
      type: object
      properties:
        code:
          {
            type: string,
            examples:
              [
                translate_to_english,
                translate_to_chinese,
                paraphrase,
                find_supporting_references,
              ],
          }
        displayZh: { type: string }
        displayEn: { type: string }
        lane: { type: string, enum: [local, remote] }
        maxInputChars: { type: integer }
        timeoutMs: { type: integer }
        enabled: { type: boolean }
    Release:
      type: object
      properties:
        target: { type: string, enum: [app, ime] }
        version: { type: string }
        build: { type: string }
        url: { type: string, format: uri }
        byteSize: { type: integer, format: int64 }
        sha512Base64: { type: string }
        ed25519Signature: { type: string }
        minOsVersion: { type: [string, 'null'] }
        minAppVersion: { type: [string, 'null'] }
        mandatory: { type: boolean }
        notesUrl: { type: [string, 'null'] }

paths:
  /healthz:
    get:
      security: []
      summary: liveness (no user data)
      responses:
        '200': { description: ok }

  /ping:
    get:
      summary: clock sync for client devices
      responses:
        '200':
          description: envelope with serverTime only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /auth/apple/challenge:
    post:
      security: []
      summary: get one-shot nonce for Sign in with Apple  [KEYSAKE endpoint]
      responses:
        '200':
          description: nonce
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          nonce: { type: string }
                          expiresAt: { type: integer, format: int64 }

  /auth/apple/verify:
    post:
      security: []
      summary: exchange identityToken (+nonce) for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken: { type: string }
                fullName: { type: [string, 'null'] }
                email: { type: [string, 'null'] }
      responses:
        '200':
          description: token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userToken: { type: string }
                          expiresIn: { type: integer }
                          user: { type: object }
        '401': { description: credential_invalid }

  /auth/apple/web/exchange:
    post:
      security: []
      summary: exchange browser-login ticket for a session  [KEYSAKE endpoint]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string }
                codeVerifier: { type: [string, 'null'], description: PKCE }
      responses:
        '200':
          {
            description: token,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Envelope' } },
              },
          }
        '409': { description: ticket already exchanged or origin mismatch }

  /auth/logout:
    post:
      {
        summary: revoke calling session,
        responses: { '200': { description: ok } },
      }

  /account:
    delete:
      summary: 'start asynchronous account deletion  [KEYSAKE UI: 账号正在删除中]'
      responses:
        '202':
          description: deleting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /profile:
    get:
      summary: profile, plan, usage
      responses:
        '200':
          {
            description: envelope,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Envelope' } },
              },
          }

  /contents/batch:
    post:
      summary: upload queued fragments with partial success  [KEYSAKE FragmentSync/SaveContentRequest]
      parameters:
        [
          { $ref: '#/components/parameters/idempotency' },
          { $ref: '#/components/parameters/deviceDigest' },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/FragmentInput' }
      responses:
        '200':
          description: per-item results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          results:
                            type: array
                            items:
                              type: object
                              properties:
                                clientId: { type: string }
                                id: { type: [string, 'null'] }
                                code:
                                  {
                                    type: string,
                                    examples:
                                      [ok, duplicate, validation_failed],
                                  }
                                message: { type: [string, 'null'] }

  /contents:
    get:
      summary: list collected fragments by local date range  [KEYSAKE 收录/选择收录日期]
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, maximum: 200 } }
      responses:
        '200':
          description: page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Fragment' }
                          nextCursor: { type: [string, 'null'] }
        '404': { description: data_not_found (empty state) }

  /contents/{id}:
    parameters:
      [
        {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      {
        summary: one fragment,
        responses:
          {
            '200': { description: fragment },
            '404': { description: data_not_found },
          },
      }
    patch:
      {
        summary: update translation or status,
        responses:
          { '200': { description: ok }, '409': { description: conflict } },
      }
    delete:
      {
        summary: soft delete then purge,
        responses: { '200': { description: ok } },
      }

  /contents/statistics:
    post:
      summary: daily aggregates, never raw keystrokes  [KEYSAKE endpoint]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: array
                  maxItems: 92
                  items: { $ref: '#/components/schemas/DailyCount' }
      responses:
        '200':
          {
            description: accepted,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Envelope' } },
              },
          }

  /contents/grammar-analysis:
    post:
      summary: run grammar analysis  [KEYSAKE endpoint, no UI in build 34/54]
      parameters: [{ $ref: '#/components/parameters/idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 8000 }
                lang: { type: string }
                contentId: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          {
            description: analysis,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Envelope' } },
              },
          }
        '402': { description: quota_exceeded }

  /grammar-analyses:
    get:
      summary: list analyses  [KEYSAKE endpoint]
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer } }
      responses: { '200': { description: page } }

  /grammar-analyses/{id}:
    parameters:
      [
        {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get: { summary: detail, responses: { '200': { description: analysis } } }
    delete: { summary: delete, responses: { '200': { description: ok } } }

  /ai/tasks:
    get:
      summary: task registry (client caches 15 min)
      responses:
        '200':
          description: registry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasks:
                            type: array
                            items: { $ref: '#/components/schemas/AiTask' }

  /ai/tasks/{task}:
    post:
      summary: run a generative task, NDJSON streaming
      parameters:
        [{ in: path, name: task, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 4000 }
                sourceLang: { type: string }
                targetLang: { type: [string, 'null'] }
                stream: { type: boolean, default: true }
                context:
                  {
                    type: [string, 'null'],
                    description: optional surrounding text,
                    opt-in,
                  }
      responses:
        '200':
          description: streaming NDJSON deltas
          content:
            application/x-ndjson:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [delta, done, error] }
                  text: { type: [string, 'null'] }
                  references: { type: [array, 'null'] }
                  usage: { type: [object, 'null'] }
        '402': { description: quota_exceeded }
        '502':
          {
            description: ai_provider_error (client must fall back to local lane),
          }

  /feedback:
    post:
      summary: support ticket with images  [KEYSAKE requires login, email max 320 bytes]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4000 }
                email: { type: [string, 'null'], maxLength: 320 }
                appVersion: { type: [string, 'null'] }
                imeVersion: { type: [string, 'null'] }
                osVersion: { type: [string, 'null'] }
                images:
                  type: array
                  maxItems: 4
                  items: { type: string, format: binary }
      responses:
        '201': { description: created }
        '401': { description: credential_missing }

  /releases:
    get:
      summary: latest app or IME release  [KEYSAKE has separate "有新版本输入法" state]
      parameters:
        - {
            in: query,
            name: target,
            schema: { type: string, enum: [app, ime] },
          }
        - { in: query, name: channel, schema: { type: string } }
      responses:
        '200':
          description: release
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Release' }
