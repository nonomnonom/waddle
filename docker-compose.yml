services:
  db:
    image: postgres:16-alpine
    container_name: waddle-db
    environment:
      POSTGRES_USER: waddle
      POSTGRES_PASSWORD: waddle
      POSTGRES_DB: waddle
    ports:
      - '5433:5432'
    volumes:
      - waddle-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waddle -d waddle']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  waddle-pgdata:
